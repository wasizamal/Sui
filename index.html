<script>
function isSafari16or17() {
  const ua = navigator.userAgent;
  const isSafari = /^((?!chrome|android).)*safari/i.test(ua);

  if (!isSafari) return false;

  const versionMatch = ua.match(/version\/(\d+)/i);
  if (versionMatch) {
    const version = parseInt(versionMatch[1], 10);
    return version === 16 || version === 17;
  }

  return false;
}

if (isSafari16or17()) {
  document.documentElement.classList.add('safari-16-17');
  console.log('Safari 16/17 detected - applying blend mode fix');
}

    const parentBlock = submitBtn.closest('.hs-submit_block');

    function isValidEmail(email) {
      const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return regex.test(email);
    }

    function showSuccess() {
      submitBtn.classList.add('success');
      if (parentBlock) parentBlock.classList.add('success');
      successMsg.style.display = 'block';
      errorMsg.style.display = 'none';
      submitBtn.classList.remove('disable');
      if (parentBlock) parentBlock.classList.remove('disable');
    }

    function showError() {
      errorMsg.style.display = 'block';
      successMsg.style.display = 'none';
      submitBtn.classList.add('disable');
      if (parentBlock) parentBlock.classList.add('disable');
    }

    async function ajaxSubmit() {
      try {
        const formData = new FormData(form);
        await fetch(form.action, {
          method: (form.method || 'POST').toUpperCase(),
          body: formData,
          mode: 'no-cors'
        });
        showSuccess();
      } catch (err) {
        showError();
      }
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const email = input.value.trim();
      if (!isValidEmail(email)) {
        showError();
        return;
      }
      ajaxSubmit();
    });

    input.addEventListener('input', function () {
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      submitBtn.classList.remove('disable');
      submitBtn.classList.remove('success');
      if (parentBlock) {
        parentBlock.classList.remove('success');
        parentBlock.classList.remove('disable');
      }
    });

    const observer = new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        mutation.addedNodes.forEach(function (node) {
          if (node.nodeType === 1) {
            const text = node.textContent.trim();
            if (text.includes('Thanks for subscribing')) {
              node.style.display = 'none';
              showSuccess();
            }
          }
        });
      });
    });

    observer.observe(form, { childList: true, subtree: true });
  });

  function resetForm(form) {

    const submitBtn = form.querySelector('.hs-submit');

      if (parentBlock) parentBlock.classList.remove('disable', 'success');

  }

<script>
(function () {
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const mq = window.matchMedia('(min-width: 768px)');

  let cleanups = [];

  const setup = () => {
    const forms = document.querySelectorAll('form.hs-form_block');
    if (!forms.length) return;

    const restores = [];

    forms.forEach((form) => {
      const button = form.querySelector('.hs-submit');
      const input = form.querySelector('.hs-input');
      if (!button || !input) return;

      const success = form.querySelector('.hs_success-message');
      const error = form.querySelector('.hs_error-message');
      const original = button.textContent.trim();
      const waitText = button.getAttribute('data-wait-text') || 'Please wait';
      const doneText = button.getAttribute('data-done-text') || 'Subscribed';

      let pending = false;
      let fallback;
      let obs;

      const visible = (el) =>
        el && el.style.display !== 'none' && getComputedStyle(el).display !== 'none';

      const restore = () => {
        pending = false;
        clearTimeout(fallback);
        button.classList.remove('is-waiting');
        button.style.minWidth = '';
        button.disabled = false;
        button.textContent = original;
      };

      const finish = () => {
        if (!pending) return;
        if (visible(success)) {
          pending = false;
          clearTimeout(fallback);
          button.classList.remove('is-waiting');
          button.style.minWidth = '';
          button.disabled = false;
          button.textContent = doneText;
        } else if (visible(error)) {
          restore();
        }
      };

      if (success || error) {
        obs = new MutationObserver(finish);
        [success, error].forEach(
          (el) => el && obs.observe(el, { attributes: true, attributeFilter: ['style', 'class'] })
        );
      }

      const onSubmit = () => {
        if (pending) return;
        if (!EMAIL.test(input.value.trim())) return;
        pending = true;
        button.style.minWidth = button.offsetWidth + 'px';
        button.textContent = waitText;
        button.classList.add('is-waiting');
        requestAnimationFrame(() => { button.disabled = true; });
        clearTimeout(fallback);
        fallback = setTimeout(restore, 10000);
      };

      form.addEventListener('submit', onSubmit);
      input.addEventListener('input', restore);

      restores.push(restore);
      cleanups.push(() => {
        form.removeEventListener('submit', onSubmit);
        input.removeEventListener('input', restore);
        if (obs) obs.disconnect();
        restore();
      });
    });

    const restoreAll = () => restores.forEach((fn) => fn());
    const toggles = document.querySelectorAll('.navbar-dd_toggle');
    const resetBtns = document.querySelectorAll('.hm_back-button, .hamburger-menu');

    toggles.forEach((el) => el.addEventListener('mouseenter', restoreAll));
    resetBtns.forEach((el) => el.addEventListener('click', restoreAll));

    cleanups.push(() => {
      toggles.forEach((el) => el.removeEventListener('mouseenter', restoreAll));
      resetBtns.forEach((el) => el.removeEventListener('click', restoreAll));
    });
  };

  const teardown = () => {
    cleanups.forEach((fn) => fn());
    cleanups = [];
  };

  const apply = () => {
    teardown();
    if (mq.matches) setup();
  };

  document.addEventListener('DOMContentLoaded', () => {
    apply();
    mq.addEventListener('change', apply);
  });
})();
</script>





<script>
(function () {
  const DEFAULT_SPEED = 75;

  const imagesReady = (scope) => {
    const imgs = Array.from(scope.querySelectorAll('img'));
    if (!imgs.length) return Promise.resolve();
    return Promise.all(
      imgs.map((img) =>
        img.complete
          ? Promise.resolve()
          : new Promise((res) => {
              img.addEventListener('load', res, { once: true });
              img.addEventListener('error', res, { once: true });
            })
      )
    );
  };

  const buildCarousel = (carousel) => {
    const track = carousel.querySelector('[data-carousel-track]');
    if (!track) return null;

    const base = track.querySelector('[data-carousel-item]');
    if (!base) return null;

    track.querySelectorAll('[data-carousel-item]:not(:first-child)').forEach((el) => el.remove());
    gsap.set(track, { clearProps: 'transform,translate,rotate,scale' });

    Object.assign(track.style, {
      display: 'flex',
      flexWrap: 'nowrap',
      willChange: 'transform'
    });
    base.style.flex = '0 0 auto';

    const containerWidth = carousel.getBoundingClientRect().width;
    const itemWidth = base.getBoundingClientRect().width;
    if (!itemWidth) return null;

    const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
    const period = itemWidth + gap;
    const copies = Math.max(2, Math.ceil(containerWidth / period) + 1);

    const frag = document.createDocumentFragment();
    for (let i = 1; i < copies; i++) {
      const clone = base.cloneNode(true);
      clone.setAttribute('aria-hidden', 'true');
      clone.style.flex = '0 0 auto';
      frag.appendChild(clone);
    }
    track.appendChild(frag);

    const speed = parseFloat(carousel.dataset.carouselSpeed) || DEFAULT_SPEED;

    return gsap.to(track, {
      x: -period,
      ease: 'none',
      repeat: -1,
      duration: period / speed
    });
  };

  const initCarousels = () => {
    const carousels = document.querySelectorAll('[data-carousel]');
    if (!carousels.length) return;

    let tweens = [];
    const build = () => {
      tweens.forEach((t) => t && t.kill());
      tweens = Array.from(carousels, buildCarousel);
    };

    Promise.all(Array.from(carousels, imagesReady)).then(build);

    let lastWidth = window.innerWidth;
    let rid;
    window.addEventListener('resize', () => {
      if (window.innerWidth === lastWidth) return;
      lastWidth = window.innerWidth;
      clearTimeout(rid);
      rid = setTimeout(build, 200);
    });
  };

  initCarousels();
})();
</script>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const DOT = 2;
  const TARGET = 12;
  const COLOR = '#C2C6CD';
 
  const positions = (length) => {
    const span = Math.max(0, length - DOT);
    const n = Math.max(1, Math.round(span / TARGET));
    const step = span / n;
    const arr = [];
    for (let i = 0; i <= n; i++) arr.push(Math.round(i * step));
    return arr;
  };
 
  const drawFrame = (item) => {
    let svg = item.querySelector(':scope > .dotted-frame_svg');
    if (!svg) {
      svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'dotted-frame_svg');
      svg.setAttribute('xmlns', NS);
      item.appendChild(svg);
    }
 
    const w = Math.round(item.offsetWidth);
    const h = Math.round(item.offsetHeight);
    if (!w || !h) return;
 
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    while (svg.firstChild) svg.removeChild(svg.firstChild);
 
    const addDot = (x, y) => {
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', x);
      r.setAttribute('y', y);
      r.setAttribute('width', DOT);
      r.setAttribute('height', DOT);
      r.setAttribute('fill', COLOR);
      r.setAttribute('shape-rendering', 'crispEdges');
      svg.appendChild(r);
    };
 
    const xs = positions(w);
    const ys = positions(h);
    const lastY = ys[ys.length - 1];
 
    xs.forEach((x) => {
      addDot(x, 0);
      addDot(x, h - DOT);
    });
 
    ys.forEach((y) => {
      if (y === 0 || y === lastY) return;
      addDot(0, y);
      addDot(w - DOT, y);
    });
  };
 
  const init = () => {
    const items = document.querySelectorAll('[data-dotted-frame]');
    if (!items.length) return;
    items.forEach((item) => {
      drawFrame(item);
      if (window.ResizeObserver) {
        new ResizeObserver(() => drawFrame(item)).observe(item);
      }
    });
  };
 
  document.addEventListener('DOMContentLoaded', init);
})();

    '/press-center':             { action: 'coming-soon', label: 'Press Center' },
    '/research':                 { action: 'coming-soon', label: 'Research' },
    '/security':                 { action: 'coming-soon', label: 'Security' },
    '/validators':               { action: 'coming-soon', label: 'Validators' },
    '/bug-bounty-program':       { action: 'coming-soon', label: 'Bug Bounty Program' },
    '/networkinfo':              { action: 'coming-soon', label: 'Network Info' },
    '/about':                    { action: 'coming-soon', label: 'About AEDINOVUS' },
    '/terms':                    { action: 'coming-soon', label: 'Terms of Service' },
    '/privacy-policy':           { action: 'coming-soon', label: 'Privacy Policy' },
  };

  // ─── Domains we let through as-is (genuine external links) ─────────────────
  const allowedExternalDomains = [
    'docs.sui.io', 'github.com', 'youtube.com', 'twitter.com', 'x.com',
    'discord.com', 'linkedin.com', 'luma.com', 'deepsurge.xyz',
    'aedinovus.com', 'fonts.googleapis.com', 'fonts.gstatic.com',
    'cdn.prod.website-files.com', 'blog.sui.io',
  ];

  // ─── External domains that map to our modal/scroll instead ─────────────────
  const legacyExternalMap = {
    'walrus.xyz':         { action: 'scroll', target: '#agency-capabilities' },
    'seal.mystenlabs':    { action: 'scroll', target: '#agency-capabilities' },
    'deepbook.tech':      { action: 'scroll', target: '#agency-capabilities' },
    'suins.io':           { action: 'scroll', target: '#agency-capabilities' },
    'suiplay.sui.io':     { action: 'modal',  mode: 'consultation' },
    'sui.io':             { action: 'scroll', target: '#agency-capabilities' },
    'mystenlabs.com':     { action: 'scroll', target: '#agency-capabilities' },
    'suifoundation':      { action: 'coming-soon', label: 'Foundation Resources' },
    'forums.sui.io':      { action: 'coming-soon', label: 'Community Forum' },
    'cal.com':            { action: 'modal',  mode: 'consultation' },
    'suihub.org':         { action: 'coming-soon', label: 'Sui Hub' },
    'status.sui.io':      { action: 'coming-soon', label: 'Network Status' },
    'live.standards.site':{ action: 'coming-soon', label: 'Media Kit' },
    'jobs.ashbyhq.com':   { action: 'coming-soon', label: 'Careers at AEDINOVUS' },
  };

  // ─── Scroll helper ──────────────────────────────────────────────────────────
  function scrollToSection(target) {
    if (target === 'body' || target === '/') {
      if (window.lenis) {
        window.lenis.scrollTo(0, { duration: 1.0 });
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      return;
    }
    if (window.lenis) {
      window.lenis.scrollTo(target, {
        duration: 1.2,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t))
      });
    } else {
      const el = document.querySelector(target);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }
  }

  // ─── Modal helpers ──────────────────────────────────────────────────────────
  function openModal(mode, customTitle, customSubtitle) {
    const modal       = document.getElementById('aedinovus-modal');
    const title       = document.getElementById('aedinovus-modal-title');
    const subtitle    = document.getElementById('aedinovus-modal-subtitle');
    const formContent = document.getElementById('aedinovus-modal-form-content');
    const successContent = document.getElementById('aedinovus-modal-success-content');
    if (!modal) return;

    formContent.style.display    = 'block';
    successContent.style.display = 'none';

    const form          = document.getElementById('aedinovus-contact-form');
    const serviceGroup  = document.getElementById('modal-service')
                            ? document.getElementById('modal-service').closest('.aedinovus-form-group') : null;
    const messageGroup  = document.getElementById('modal-message')
                            ? document.getElementById('modal-message').closest('.aedinovus-form-group') : null;
    const submitBtn     = form ? form.querySelector('.aedinovus-form-submit') : null;

    if (form) form.reset();

    if (mode === 'coming-soon') {
      if (title)   title.textContent    = customTitle    || 'Feature Coming Soon';
      if (subtitle) subtitle.textContent = customSubtitle || "We're preparing this section. Leave your email and we'll notify you when it's live.";
      if (serviceGroup) serviceGroup.style.display = 'none';
      if (messageGroup) messageGroup.style.display = 'none';
      if (submitBtn)    submitBtn.textContent       = 'Keep Me Updated';
      if (form) form.dataset.mode = 'coming-soon';
    } else {
      if (title)   title.textContent    = customTitle    || 'Request Consultation';
      if (subtitle) subtitle.textContent = customSubtitle || 'Discuss your objectives and map out a custom solution with our technology partners.';
      if (serviceGroup) serviceGroup.style.display = 'block';
      if (messageGroup) messageGroup.style.display = 'block';
      if (submitBtn)    submitBtn.textContent       = 'Submit Request';
      if (form) form.dataset.mode = 'consultation';
    }

    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    if (window.lenis) window.lenis.stop();

    // Focus first input for accessibility
    setTimeout(() => {
      const firstInput = modal.querySelector('input, select, textarea');
      if (firstInput) firstInput.focus();
    }, 400);
  }

  function closeModal() {
    const modal = document.getElementById('aedinovus-modal');
    if (!modal) return;
    modal.classList.remove('active');
    document.body.style.overflow = '';
    if (window.lenis) window.lenis.start();
  }

  // ─── Close mobile hamburger if open ────────────────────────────────────────
  function closeMobileNav() {
    const nav = document.querySelector('#navigation[data-collapse]');
    if (nav && nav.classList.contains('w--open')) {
      const menuButton = nav.querySelector('.w-nav-button');
      if (menuButton) menuButton.click();
    }
    // Also try direct class-based close
    const openMenus = document.querySelectorAll('.w--open');
    openMenus.forEach(el => {
      if (!el.id || el.id !== 'aedinovus-modal') {
        el.classList.remove('w--open');
      }
    });
  }

  // ─── Determine action for a given href + link text ─────────────────────────
  function resolveAction(href, text) {
    // 1. Explicit text-based overrides for CTAs
    const lowerText = (text || '').toLowerCase().trim();
    const consultationKeywords = ['start a project', 'request consultation', 'book a call', 'launch project', 'estimate project', 'contact agency', 'request a proposal', 'get started', 'work with us', 'hire us', 'contact us', 'schedule', 'book'];
    if (consultationKeywords.some(k => lowerText.includes(k))) {
      return { action: 'modal', mode: 'consultation' };
    }
    const servicesKeywords = ['our services', 'discover our capabilities', 'explore portfolio', 'view portfolio', 'explore services', 'see what we do'];
    if (servicesKeywords.some(k => lowerText.includes(k))) {
      return { action: 'scroll', target: '#agency-capabilities' };
    }

    // 2. Internal path routing
    if (href.startsWith('/') && !href.startsWith('//')) {
      // Strip query + hash
      const cleanPath = href.split('?')[0].split('#')[0];
      if (cleanPath.startsWith('/services/')) {
        return null; // Let the browser handle it naturally
      }
      if (routeActions[cleanPath]) return routeActions[cleanPath];
      // For unrecognised internal routes, use coming-soon
      return { action: 'coming-soon', label: text || 'This Page' };
    }

    // 3. External URL routing
    try {
      const url = new URL(href);
      const hostname = url.hostname;

      // Allowed external — let through
      if (allowedExternalDomains.some(d => hostname.includes(d))) return null;

      // Legacy/blocked externals
      for (const [domain, action] of Object.entries(legacyExternalMap)) {
        if (hostname.includes(domain) || href.includes(domain)) return action;
      }

      // Any remaining sui.io subdomains
      if (hostname.endsWith('.sui.io') || hostname === 'sui.io') {
        return { action: 'scroll', target: '#agency-capabilities' };
      }

      // Unknown external → let through
      return null;
    } catch (e) {
      return null;
    }
  }

  // ─── Initialise modal + form event listeners ────────────────────────────────
  function initModal() {
    const modal           = document.getElementById('aedinovus-modal');
    const closeBtn        = document.getElementById('aedinovus-modal-close');
    const successCloseBtn = document.getElementById('aedinovus-modal-success-close');
    const form            = document.getElementById('aedinovus-contact-form');
    if (!modal) return;

    // Close button
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    if (successCloseBtn) successCloseBtn.addEventListener('click', closeModal);

    // Click-outside overlay to close
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // ESC key to close
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
    });

    // Trap focus inside modal when open
    modal.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab' || !modal.classList.contains('active')) return;
      const focusable = modal.querySelectorAll('input, select, textarea, button, [tabindex]:not([tabindex="-1"])');
      const first = focusable[0];
      const last  = focusable[focusable.length - 1];
      if (e.shiftKey) {
        if (document.activeElement === first) { e.preventDefault(); last.focus(); }
      } else {
        if (document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    // Form submit handler
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const submitBtn  = form.querySelector('.aedinovus-form-submit');
        const origText   = submitBtn ? submitBtn.textContent : '';
        if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Sending…'; }

        setTimeout(() => {
          if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = origText; }

          document.getElementById('aedinovus-modal-form-content').style.display = 'none';
          const successContent = document.getElementById('aedinovus-modal-success-content');
          const successTitle   = document.getElementById('aedinovus-success-title');
          const successSub     = document.getElementById('aedinovus-success-subtitle');

          if (form.dataset.mode === 'coming-soon') {
            if (successTitle) successTitle.textContent = 'Registration Confirmed';
            if (successSub)   successSub.textContent   = 'You are on the list! We will notify you as soon as this feature is ready.';
          } else {
            if (successTitle) successTitle.textContent = 'Request Received';
            if (successSub)   successSub.textContent   = 'Thank you! Our strategist team will review your brief and contact you within 24 hours to schedule a consultation.';
          }

          if (successContent) successContent.style.display = 'flex';
        }, 900);
      });
    }
  }

  // ─── Intercept newsletter forms ────────────────────────────────────────────
  function initNewsletterForms() {
    // Select all newsletter/signup forms on the page
    const newsletterForms = document.querySelectorAll('form.hs-form_block, form[id*="newsletter"]');
    newsletterForms.forEach((form) => {
      // Prevent native submission; show a custom success state instead
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        e.stopImmediatePropagation();

        const emailInput = form.querySelector('input[type="email"]');
        const email = emailInput ? emailInput.value.trim() : '';
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          if (emailInput) {
            emailInput.style.borderColor = '#ef4444';
            emailInput.placeholder = 'Please enter a valid email';
            setTimeout(() => {
              emailInput.style.borderColor = '';
              emailInput.placeholder = 'Enter your email';
            }, 2500);
          }
          return;
        }

        // Show the success state within the form's container
        const submitBtn = form.querySelector('[type="submit"], .hs-submit, .w-button');
        if (submitBtn) {
          const origText = submitBtn.textContent;
          submitBtn.disabled    = true;
          submitBtn.textContent = 'Subscribed ✓';
          submitBtn.style.background = '#298dff';
          submitBtn.style.color      = '#fff';
          // Reset after 4s
          setTimeout(() => {
            submitBtn.disabled    = false;
            submitBtn.textContent = origText;
            submitBtn.style.background = '';
            submitBtn.style.color      = '';
            form.reset();
          }, 4000);
        }
      }, true);
    });
  }

  // ─── Global click interceptor ───────────────────────────────────────────────
  function initClickInterceptor() {
    document.addEventListener('click', function(e) {
      const link = e.target.closest('a');
      if (!link) return;

      const href = (link.getAttribute('href') || '').trim();
      const text = link.textContent.trim();

      // Ignore blank / void hrefs
      if (!href || href === '#' || href === 'javascript:void(0)' || href === 'javascript:;') return;

      // Ignore mailto / tel
      if (href.startsWith('mailto:') || href.startsWith('tel:')) return;

      const resolved = resolveAction(href, text);
      if (resolved === null) return; // Let the browser handle it naturally

      e.preventDefault();
      closeMobileNav();

      if (resolved.action === 'scroll') {
        const isSubpage = window.location.pathname.includes('/services/');
        if (isSubpage) {
          let hash = resolved.target;
          if (hash === 'body' || hash === '/') hash = '';
          window.location.href = '/' + hash;
        } else {
          scrollToSection(resolved.target);
        }
      } else if (resolved.action === 'modal') {
        openModal(resolved.mode || 'consultation',
          resolved.mode === 'coming-soon' ? (resolved.label || text) : 'Request Consultation',
          resolved.mode === 'coming-soon'
            ? `We are optimising the "${resolved.label || text}" section for AEDINOVUS. Leave your email and we'll notify you when it's live.`
            : 'Discuss your objectives and map out a custom solution with our technology partners.');
      } else if (resolved.action === 'coming-soon') {
        const label = resolved.label || text || 'This Page';
        openModal('coming-soon', label, `We are currently preparing the "${label}" section for AEDINOVUS. Register your email below to be notified when it goes live.`);
      }
    });
  }

  // ─── Enhance hover states / micro-interactions ──────────────────────────────
  function enhanceInteractions() {
    // Add press feedback on CTA buttons
    document.querySelectorAll('.cta-button, [data-button-hover], .aedinovus-form-submit').forEach(btn => {
      btn.addEventListener('mousedown', () => { btn.style.transform = 'scale(0.97)'; });
      btn.addEventListener('mouseup', () => { btn.style.transform = ''; });
      btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
    });

    // Make navbar dropdown links keyboard-accessible
    document.querySelectorAll('.navbar-dd_toggle').forEach(toggle => {
      toggle.setAttribute('tabindex', '0');
      toggle.setAttribute('role', 'button');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggle.click();
        }
      });
    });

    // Nav CTA (Start a Project button in navbar)
    const navCTA = document.querySelector('.nav_cta-button, .cta-dd_toggle');
    if (navCTA) {
      navCTA.addEventListener('click', (e) => {
        // Only intercept if it would navigate
        const href = (navCTA.getAttribute('href') || '').trim();
        if (href && href !== '#') {
          e.preventDefault();
          openModal('consultation', 'Request Consultation', 'Discuss your objectives and map out a custom solution with our technology partners.');
        }
      });
    }

    // Tabs: ensure tab nav items are keyboard-accessible
    document.querySelectorAll('.tabs_wrapper, .tabs_num').forEach(tab => {
      if (!tab.getAttribute('tabindex')) {
        tab.setAttribute('tabindex', '0');
      }
    });
  }

  // ─── Boot ───────────────────────────────────────────────────────────────────
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      initModal();
      initClickInterceptor();
      initNewsletterForms();
      enhanceInteractions();
    });
  } else {
    // DOM already ready
    initModal();
    initClickInterceptor();
    initNewsletterForms();
    enhanceInteractions();
  }


})();
