<!DOCTYPE html><html><body><h1>Debug Utility</h1><div id="out">Loading debug data...</div><script>(async function() { try { let res1 = await fetch('/test_image_text.webp'); let text1 = await res1.text(); let res2 = await fetch('/test_image.webp'); let text2 = await res2.text(); let out = document.getElementById('out'); out.innerHTML = '<p><b>test_image_text.webp:</b> Status ' + res1.status + ', Length ' + text1.length + '</p><p><b>test_image.webp:</b> Status ' + res2.status + ', Length ' + text2.length + '</p>'; let urls = []; for (let i = 0; i <= 75; i++) { let num = String(i).padStart(4, '0'); urls.push('/assets/images/sequences/homepage-scroll/frame_' + num + '.webp'); } let results = await Promise.all(urls.map(async url => { try { let res = await fetch(url); return res.status === 200; } catch(e) { return false; } })); let successCount = results.filter(Boolean).length; out.innerHTML += '<p><b>All sequence frames test:</b> ' + successCount + ' / 76 successful (200 OK)</p>'; } catch(e) { document.getElementById('out').innerText = 'Error: ' + e.message; } })();</script></body></html>
